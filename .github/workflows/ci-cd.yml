name: "Cloud DevOps CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    name: "1. Unit Tests & Lint (Python)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check app/

      - name: Run Pytest with Coverage (>= 80%)
        run: |
          PYTHONPATH=. pytest app/tests/test_main.py --cov=app --cov-fail-under=80 -v

  iac-quality:
    name: "2. IaC, Helm & Security Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: Helm Lint (Stable & Canary)
        run: |
          helm lint deploy/helm/demo-api
          helm template demo-api deploy/helm/demo-api --values deploy/helm/demo-api/values.yaml > /dev/null
          helm template demo-api deploy/helm/demo-api --values deploy/helm/demo-api/values.yaml --values deploy/helm/demo-api/values-canary.yaml > /dev/null

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0"

  docker-trivy:
    name: "3. Container Build & Security Scan"
    runs-on: ubuntu-latest
    needs: [test, iac-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: demo-api:test

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "demo-api:test"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  aiops-validation:
    name: "4. AIOps Engine Validation"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test AIOps SRE Incident Analyzer
        run: |
          PYTHONPATH=ai python3 ai/incident_analyzer.py

      - name: Test AIOps Progressive Canary Evaluator
        run: |
          PYTHONPATH=ai python3 ai/canary_evaluator.py 0.0 42.0

      - name: Test AIOps Security Triager
        run: |
          PYTHONPATH=ai python3 ai/security_triager.py
