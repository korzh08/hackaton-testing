apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "demo-api.name" . }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 10s
