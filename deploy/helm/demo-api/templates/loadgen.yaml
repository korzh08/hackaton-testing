{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-api.fullname" . }}-loadgen
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "demo-api.name" . }}-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "demo-api.name" . }}-loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting background synthetic traffic generator (~10 RPS)...";
              INGRESS_URL="http://ingress-nginx-controller.ingress-nginx.svc.cluster.local"
              FALLBACK_URL="http://{{ include "demo-api.fullname" . }}-stable:{{ .Values.service.port }}"
              while true; do
                TARGET="${FALLBACK_URL}"
                if nc -z -w 1 ingress-nginx-controller.ingress-nginx.svc.cluster.local 80 2>/dev/null; then
                  TARGET="${INGRESS_URL}"
                fi
                curl -s -o /dev/null -H "Host: {{ .Values.ingress.host }}" "${TARGET}/api/v1/info" > /dev/null 2>&1 || true;
                curl -s -o /dev/null -H "Host: {{ .Values.ingress.host }}" "${TARGET}/healthz" > /dev/null 2>&1 || true;
                sleep 0.1;
              done
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
{{- end }}
